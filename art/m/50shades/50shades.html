<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>bzs42::artwork — 50 Shades of Purple</title>
    <style>
        :root {
            --bg: #0e1019;
            --text: #fffaf4;
            --accent: #ffb900;
            --dim: #9e9c9a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            overflow: hidden;
        }

        /* Breadcrumb: bzs42 -> Site-Root, artwork -> Galerie-Index. Unterstrichen. */
        .crumbs {
            flex: 0 0 auto;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .crumbs a {
            color: inherit;
            text-decoration: underline;
        }

        /* Werktitel, eine Stufe größer als die Breadcrumb */
        .wtitle {
            flex: 0 0 auto;
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .stage {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .stage::-webkit-scrollbar { display: none; }

        .slide {
            flex: 0 0 100%;
            min-width: 100%;
            height: 100%;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .caption {
            flex: 0 0 auto;
            text-align: center;
            font-size: 1rem;
            color: var(--dim);
            min-height: 1.3em;
        }

        /* Untere, horizontal scrollbare Thumb-Leiste */
        .thumbs {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #444 transparent;
        }

        .thumb {
            flex: 0 0 auto;
            height: 76px;
            width: 76px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            opacity: 0.55;
            border: 2px solid transparent;
            transition: opacity 0.25s ease, border-color 0.25s ease;
        }

        .thumb.active {
            opacity: 1;
            border-color: var(--accent);
        }
        @media (prefers-reduced-motion: reduce) {
            .stage { scroll-behavior: auto; }
        }
    </style>
</head>

<body>

    <nav class="crumbs"><a href="../../../index.html">bzs42</a>::<a href="../index.html">artwork</a></nav>
    <h1 class="wtitle">.50 Shades of Purple - Light Fever</h1>

    <div class="stage" id="stage">
        <div class="slide"><img src="20240315_163053_edited_956.webp" alt="Light Fever — Ego Zentrifuge" /></div>
        <div class="slide"><img src="20240511_163443_edited_956.webp" loading="lazy" alt="Light Fever — Transzendieren" /></div>
        <div class="slide"><img src="P_20250125_182638_edited_956.webp" loading="lazy" alt="Light Fever — Interferenz" /></div>
        <div class="slide"><img src="P_20250703_000143_edited_956.webp" loading="lazy" alt="Light Fever — Lichtstrom" /></div>
        <div class="slide"><img src="PSX_20250918_220054_1_956.webp" loading="lazy" alt="Light Fever — Night Drift" /></div>
        <div class="slide"><img src="P_20250823_211758_edited_croped_956.webp" loading="lazy" alt="Light Fever — Sonnensturm" /></div>
        <div class="slide"><img src="P_20251220_111434_edited_956.webp" loading="lazy" alt="Light Fever — Multiversum" /></div>
        <div class="slide"><img src="P_20251231_235720_edited_956.webp" loading="lazy" alt="Light Fever — Supernova" /></div>
    </div>
    <div class="caption" id="caption">Ego Zentrifuge</div>

    <div class="thumbs" id="thumbs">
        <img class="thumb active" src="20240315_163053_edited_400.webp" data-caption="Ego Zentrifuge" alt="Light Fever — Ego Zentrifuge" />
        <img class="thumb" src="20240511_163443_edited_400.webp" data-caption="Transzendieren" alt="Light Fever — Transzendieren" />
        <img class="thumb" src="P_20250125_182638_edited_400.webp" data-caption="Interferenz" alt="Light Fever — Interferenz" />
        <img class="thumb" src="P_20250703_000143_edited_400.webp" data-caption="Lichtstrom" alt="Light Fever — Lichtstrom" />
        <img class="thumb" src="PSX_20250918_220054_1_400.webp" data-caption="Night Drift" alt="Light Fever — Night Drift" />
        <img class="thumb" src="P_20250823_211758_edited_croped_400.webp" data-caption="Sonnensturm" alt="Light Fever — Sonnensturm" />
        <img class="thumb" src="P_20251220_111434_edited_400.webp" data-caption="Multiversum" alt="Light Fever — Multiversum" />
        <img class="thumb" src="P_20251231_235720_edited_400.webp" data-caption="Supernova" alt="Light Fever — Supernova" />
    </div>

    <script>
        const stage = document.getElementById("stage");
        const slides = Array.from(stage.querySelectorAll(".slide"));
        const thumbs = Array.from(document.querySelectorAll(".thumb"));
        const caption = document.getElementById("caption");

        function setActive(i) {
            thumbs.forEach(function (t, j) { t.classList.toggle("active", j === i); });
            if (caption && thumbs[i]) caption.textContent = thumbs[i].dataset.caption || "";
            if (thumbs[i]) thumbs[i].scrollIntoView({ inline: "center", block: "nearest" });
        }

        thumbs.forEach(function (t, i) {
            t.addEventListener("click", function () {
                slides[i].scrollIntoView({ inline: "center", block: "nearest" });
            });
        });

        const io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (e.isIntersecting) setActive(slides.indexOf(e.target));
            });
        }, { root: stage, threshold: 0.6 });

        slides.forEach(function (s) { io.observe(s); });
    </script>
</body>

</html>
