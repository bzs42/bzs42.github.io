<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>bzs42::artwork — Astrobloom</title>
    <style>
        :root {
            --void: #08060a;
            --void-warm: #140b0a;
            --bloom: #ff2f1c;
            --bloom-glow: rgba(255, 47, 28, 0.55);
            --wire: #c9ced3;
            --accent: #ffb900;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: radial-gradient(120% 90% at 50% 45%, var(--void-warm) 0%, var(--void) 60%);
            color: var(--wire);
            font-family: "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            overflow: hidden;
        }

        /* Breadcrumb in Amber (wie auf der Desktop-Astrobloom-Seite); unterstrichen. */
        .crumbs {
            flex: 0 0 auto;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .crumbs a {
            color: inherit;
            text-decoration: underline;
        }

        .wtitle {
            flex: 0 0 auto;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--bloom);
            text-shadow: 0 0 16px var(--bloom-glow);
        }

        .wtitle .ns {
            color: var(--wire);
            text-shadow: none;
        }

        .stage {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .stage::-webkit-scrollbar { display: none; }

        .slide {
            flex: 0 0 100%;
            min-width: 100%;
            height: 100%;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .thumbs {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--bloom) transparent;
        }

        .thumb {
            flex: 0 0 auto;
            height: 76px;
            width: 76px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            opacity: 0.55;
            border: 2px solid transparent;
            transition: opacity 0.25s ease, border-color 0.25s ease;
        }

        .thumb.active {
            opacity: 1;
            border-color: var(--bloom);
            box-shadow: 0 0 12px var(--bloom-glow);
        }
        @media (prefers-reduced-motion: reduce) {
            .stage { scroll-behavior: auto; }
        }
    </style>
</head>

<body>

    <nav class="crumbs"><a href="../../../index.html">bzs42</a>::<a href="../index.html">artwork</a></nav>
    <h1 class="wtitle"><span class="ns">::zenobotanis.</span>Astrobloom</h1>

    <div class="stage" id="stage">
        <div class="slide"><img src="P_20260501_190841_1290.webp" alt="Astrobloom – die vollständige Astrobionik-Skulptur" /></div>
        <div class="slide"><img src="P_20260501_190938_1290.webp" loading="lazy" alt="Astrobloom – Nahansicht einer großen roten Acrylglas-Blüte" /></div>
        <div class="slide"><img src="P_20260501_190956_1290.webp" loading="lazy" alt="Astrobloom – die rissige Regolith-Keramikbasis mit Metalldraht-Antennen" /></div>
    </div>

    <div class="thumbs" id="thumbs">
        <img class="thumb active" src="P_20260501_190841_400.webp" alt="Astrobloom – die vollständige Astrobionik-Skulptur" />
        <img class="thumb" src="P_20260501_190938_400.webp" alt="Astrobloom – Nahansicht einer großen roten Acrylglas-Blüte" />
        <img class="thumb" src="P_20260501_190956_400.webp" alt="Astrobloom – die rissige Regolith-Keramikbasis mit Metalldraht-Antennen" />
    </div>

    <script>
        const stage = document.getElementById("stage");
        const slides = Array.from(stage.querySelectorAll(".slide"));
        const thumbs = Array.from(document.querySelectorAll(".thumb"));
        const caption = document.getElementById("caption");

        function setActive(i) {
            thumbs.forEach(function (t, j) { t.classList.toggle("active", j === i); });
            if (caption && thumbs[i]) caption.textContent = thumbs[i].dataset.caption || "";
            if (thumbs[i]) thumbs[i].scrollIntoView({ inline: "center", block: "nearest" });
        }

        thumbs.forEach(function (t, i) {
            t.addEventListener("click", function () {
                slides[i].scrollIntoView({ inline: "center", block: "nearest" });
            });
        });

        const io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (e.isIntersecting) setActive(slides.indexOf(e.target));
            });
        }, { root: stage, threshold: 0.6 });

        slides.forEach(function (s) { io.observe(s); });
    </script>
</body>

</html>
